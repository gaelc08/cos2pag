[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cos2pag"
dynamic = ["version"]
description = "Set up IBM COS -> PoINT Archival Gateway bucket replication via PoINT Data Replicator"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16"]

[project.scripts]
cos2pag = "cos2pag.cli:main"

[tool.setuptools]
packages = ["cos2pag"]

[tool.setuptools.dynamic]
version = {attr = "cos2pag.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# Pinned explicitly (ruff's default rule set changes between releases):
# syntax errors, undefined/unused names and other likely bugs, no style
# rules.
select = ["E4", "E7", "E9", "F"]
